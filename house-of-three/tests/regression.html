<!doctype html><html lang="en"><meta charset="utf-8"><title>The Last Clue — browser regression</title><style>body{background:#14262b;color:#eee;font:16px system-ui}button{padding:12px;margin-right:10px}iframe{display:block;height:1000px;border:1px solid #789;margin-top:20px}#status{white-space:pre-wrap}</style><h1>Browser regression checks</h1><p>Serve this directory with a static server. Tests do not replace your saved progress.</p><button id="desktop">Test desktop</button><button id="phone">Test phone viewport</button><p id="status" role="status">Choose a viewport to begin.</p><iframe id="game" title="Game regression viewport"></iframe><script>
const frame=document.querySelector('#game'),status=document.querySelector('#status');
async function run(width){status.textContent='Running…';frame.style.width=width+'px';frame.onload=async()=>{try{const response=await fetch('regression.js');if(!response.ok)throw Error('Cannot load regression.js');frame.contentWindow.eval(await response.text());}catch(e){status.textContent='FAIL: '+e.message;}};frame.src='../The%20Last%20Clue.html?regression='+Date.now();}
document.querySelector('#desktop').onclick=()=>run(1440);document.querySelector('#phone').onclick=()=>run(390);
addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data?.houseTest)status.textContent=(e.data.passed?'PASS: ':'FAIL: ')+e.data.message;});
if(location.search.includes('autorun'))run(1440);
</script></html>
