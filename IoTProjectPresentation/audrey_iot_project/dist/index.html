<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A control room for the AI Hack Lab ESP32 boards.">
  <title>ESP Control Room</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0d10'/%3E%3Cpath d='M9 11h14v10H9zM12 7v4m4-4v4m4-4v4M12 21v4m4-4v4m4-4v4M5 14h4m-4 4h4m14-4h4m-4 4h4' stroke='%237cf2c0' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --bg:#080b0e; --panel:#11171c; --panel2:#171e24; --line:#2b343c; --text:#edf4f2; --muted:#8d9a9f; --mint:#79edbd; --cyan:#55c7e8; --amber:#ffc760; --danger:#ff6b6b; --shadow:0 20px 50px rgba(0,0,0,.28); font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(900px 500px at 40% -160px,#16463d 0,transparent 65%),var(--bg); color:var(--text); }
    button,input,select,textarea { font:inherit; }
    button { color:inherit; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:2px solid var(--mint); outline-offset:2px; }
    .shell { max-width:1500px; margin:auto; padding:24px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:26px; }
    .brand { display:flex; align-items:center; gap:14px; }
    .mark { width:42px; height:42px; border:1px solid #38705f; border-radius:12px; display:grid; place-items:center; background:#10261f; color:var(--mint); box-shadow:inset 0 0 18px #143e31; }
    h1 { font-size:1.25rem; letter-spacing:-.02em; margin:0; }
    .eyebrow { margin:2px 0 0; color:var(--muted); font:500 .75rem ui-monospace,SFMono-Regular,monospace; text-transform:uppercase; letter-spacing:.12em; }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .mode { display:flex; align-items:center; gap:9px; min-height:42px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:#0f1418; font-size:.875rem; cursor:pointer; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); box-shadow:0 0 0 4px rgba(141,154,159,.1); }
    .dot.live { background:var(--mint); box-shadow:0 0 0 4px rgba(121,237,189,.1),0 0 12px var(--mint); }
    .icon-btn { width:42px; height:42px; border:1px solid var(--line); border-radius:12px; background:#10161a; cursor:pointer; }
    .layout { display:grid; grid-template-columns:220px minmax(0,1fr); gap:24px; }
    aside { position:sticky; top:22px; align-self:start; }
    nav { display:grid; gap:5px; }
    .nav-btn { display:flex; gap:10px; align-items:center; width:100%; padding:11px 12px; border:0; border-radius:9px; background:transparent; color:var(--muted); text-align:left; cursor:pointer; }
    .nav-btn.active { color:var(--text); background:#18211f; }
    .nav-btn svg { width:18px; }
    .side-meta { margin-top:30px; padding:14px; border:1px solid var(--line); border-radius:12px; color:var(--muted); font-size:.8rem; line-height:1.55; background:rgba(17,23,28,.7); }
    main { min-width:0; }
    .home-head { margin:30px 0 20px; }
    .home-head h2 { margin:0 0 7px; font-size:clamp(1.7rem,4vw,2.55rem); letter-spacing:-.05em; }
    .home-head p { margin:0; color:var(--muted); }
    .device-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .device-card { min-width:0; border:1px solid var(--line); border-radius:18px; background:linear-gradient(150deg,var(--panel2),var(--panel)); box-shadow:var(--shadow); overflow:hidden; }
    .device-card-top { padding:20px; border-bottom:1px solid var(--line); }
    .device-number { color:var(--mint); font:600 .72rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .device-card h3 { margin:7px 0 4px; font-size:1.35rem; }
    .device-card .host { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .device-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:18px; }
    .device-stat { padding:11px; border:1px solid var(--line); border-radius:10px; background:#0d1215; }
    .device-stat span { display:block; color:var(--muted); font-size:.69rem; }
    .device-stat strong { display:block; margin-top:5px; font-size:1.05rem; }
    .open-board { width:100%; margin-top:12px; }
    .card-destinations { display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:14px; }
    .destination { min-height:38px; padding:0 8px; border:1px solid #34414a; border-radius:9px; background:#182127; color:#cdd9d7; cursor:pointer; font-size:.74rem; }
    .destination:hover { border-color:#4a6d62; background:#1d2b29; }
    .board-view { max-width:1050px; margin:auto; }
    .detail-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin:24px 0 16px; }
    .detail-title { display:flex; align-items:flex-start; gap:13px; }
    .back-btn { flex:0 0 auto; width:40px; height:40px; border:1px solid var(--line); border-radius:10px; background:#12191e; cursor:pointer; }
    .detail-head h2 { margin:0 0 4px; font-size:1.75rem; letter-spacing:-.04em; }
    .board-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:12px; padding:6px; border:1px solid var(--line); border-radius:13px; background:#0e1317; }
    .board-tab { min-height:42px; border:0; border-radius:9px; background:transparent; color:var(--muted); cursor:pointer; font-weight:650; font-size:.8rem; }
    .board-tab.active { background:#21332d; color:var(--mint); }
    .board-panel { padding:20px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(150deg,var(--panel2),var(--panel)); box-shadow:var(--shadow); }
    .board-panel > h3 { margin:0 0 5px; font-size:1.15rem; }
    .board-panel > .melody { margin:0; padding:0; border-top:0; }
    .panel-copy { margin:0 0 18px; color:var(--muted); font-size:.85rem; line-height:1.55; }
    .overview-grid { display:grid; grid-template-columns:minmax(240px,.85fr) 1.15fr; gap:14px; }
    .digital-board { position:relative; min-height:250px; display:grid; place-items:center; border:1px solid #294239; border-radius:14px; background:radial-gradient(circle at 50% 45%,#18382e,#0b1210 66%); overflow:hidden; }
    .pcb { position:relative; width:180px; height:112px; border:2px solid #3a806a; border-radius:13px; background:#12382c; box-shadow:0 15px 35px #0008,inset 0 0 25px #0b251d; }
    .chip { position:absolute; left:54px; top:26px; width:72px; height:58px; border:1px solid #4b5a5f; border-radius:5px; background:#171e21; box-shadow:inset 0 0 12px #000; }
    .pin-row { position:absolute; left:10px; right:10px; height:5px; background:repeating-linear-gradient(90deg,#d2bc73 0 5px,transparent 5px 11px); }
    .pin-row.top { top:6px; }.pin-row.bottom { bottom:6px; }
    .virtual-leds { position:absolute; right:11px; top:29px; display:grid; gap:7px; }
    .virtual-led { width:10px; height:10px; border-radius:50%; background:var(--led); opacity:.18; }
    .virtual-led.on { opacity:1; box-shadow:0 0 10px var(--led); }
    .board-caption { position:absolute; bottom:15px; color:#7fb9a7; font:600 .7rem ui-monospace,monospace; letter-spacing:.1em; }
    .overview-info { display:grid; gap:10px; }
    .overview-stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .overview-stat { padding:14px; border:1px solid var(--line); border-radius:11px; background:#0e1317; }
    .overview-stat span { display:block; margin-bottom:6px; color:var(--muted); font-size:.72rem; }
    .overview-stat strong { font-size:1.2rem; }
    .overview-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .unavailable { min-height:260px; display:grid; place-items:center; text-align:center; border:1px dashed #3a474e; border-radius:13px; background:#0e1317; }
    .unavailable strong { display:block; margin-bottom:7px; }
    .unavailable p { max-width:430px; margin:0 0 14px; color:var(--muted); line-height:1.5; }
    .intro { display:flex; justify-content:space-between; gap:20px; align-items:end; margin-bottom:18px; }
    .intro h2 { margin:0 0 6px; font-size:2rem; letter-spacing:-.045em; font-weight:650; }
    .intro p { margin:0; color:var(--muted); }
    .updated { color:var(--muted); font:500 .78rem ui-monospace,SFMono-Regular,monospace; white-space:nowrap; }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:12px; }
    .metric { min-height:112px; padding:17px 18px; border:1px solid var(--line); border-radius:14px; background:linear-gradient(150deg,#141c20,#101519); box-shadow:var(--shadow); }
    .metric-label { display:flex; justify-content:space-between; color:var(--muted); font-size:.82rem; }
    .metric-value { margin-top:17px; font-size:2rem; letter-spacing:-.04em; font-weight:620; }
    .metric-value small { color:var(--muted); font-size:.9rem; font-weight:500; }
    .board-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .card { border:1px solid var(--line); border-radius:16px; background:linear-gradient(150deg,var(--panel2),var(--panel)); box-shadow:var(--shadow); overflow:hidden; }
    .card-head { display:flex; justify-content:space-between; gap:10px; align-items:start; padding:18px 18px 15px; border-bottom:1px solid var(--line); }
    .card h3 { margin:0 0 4px; font-size:1rem; }
    .host { color:var(--muted); font:500 .74rem ui-monospace,SFMono-Regular,monospace; }
    .badge { padding:5px 8px; border-radius:999px; background:#242d33; color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; }
    .badge.online { background:#153a2f; color:var(--mint); }
    .card-body { padding:18px; }
    .label-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:11px; }
    .label-row strong { font-size:.82rem; }
    .quiet { color:var(--muted); font-size:.75rem; }
    .lights { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:21px; }
    .light { padding:0; min-height:62px; border:1px solid var(--line); border-radius:11px; background:#0e1317; cursor:pointer; }
    .bulb { width:14px; height:14px; margin:0 auto 8px; border-radius:50%; background:var(--c); opacity:.3; }
    .light.on { border-color:color-mix(in srgb,var(--c),#222 50%); background:color-mix(in srgb,var(--c),transparent 88%); }
    .light.on .bulb { opacity:1; box-shadow:0 0 13px var(--c); }
    .light span { color:var(--muted); font-size:.7rem; text-transform:capitalize; }
    .sensor-pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .sensor { padding:13px; border:1px solid var(--line); border-radius:11px; background:#0e1317; }
    .sensor span { display:block; color:var(--muted); font-size:.71rem; margin-bottom:6px; }
    .sensor strong { font-size:1.25rem; }
    .special { margin-top:14px; padding-top:16px; border-top:1px solid var(--line); }
    .special h4 { margin:0 0 12px; font-size:.85rem; }
    .range-wrap { display:flex; align-items:center; gap:12px; }
    input[type=range] { width:100%; accent-color:var(--mint); }
    .angle { width:54px; text-align:right; font:600 .82rem ui-monospace,monospace; }
    .button-row { display:flex; gap:8px; margin-top:12px; }
    .primary,.secondary,.danger { border:1px solid transparent; border-radius:9px; min-height:38px; padding:0 13px; cursor:pointer; font-size:.8rem; font-weight:650; }
    .primary { background:var(--mint); color:#07140f; }
    .secondary { background:#202a30; border-color:#34414a; }
    .danger { background:#3a1d20; border-color:#6f3138; color:#ffaaaa; }
    .distance { display:flex; align-items:baseline; gap:6px; margin:6px 0 8px; }
    .distance strong { font-size:2rem; letter-spacing:-.04em; }
    .distance span { color:var(--muted); }
    .keys { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .key-readout { min-height:72px; border:1px solid var(--line); border-radius:11px; background:#0e1317; padding:12px; }
    .key-readout span { color:var(--muted); font-size:.7rem; }
    .key-readout strong { display:block; margin-top:8px; font:600 1.45rem ui-monospace,monospace; }
    .melody { margin-top:12px; }
    .notation-toolbar { display:grid; gap:9px; margin-bottom:14px; }
    .length-tabs { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; padding:5px; border:1px solid var(--line); border-radius:11px; background:#0e1317; }
    .length-tab { min-height:42px; padding:4px; border:0; border-radius:8px; background:transparent; color:var(--muted); cursor:pointer; font-size:.72rem; font-weight:700; }
    .length-tab.active { background:#25473b; color:var(--mint); }
    .expression-row { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
    .expression-toggle { min-height:39px; border:1px solid #34414a; border-radius:9px; background:#182127; color:#b9c6c8; cursor:pointer; font-size:.75rem; font-weight:650; }
    .expression-toggle.active { border-color:var(--mint); background:#1d4939; color:var(--mint); }
    .piano-label { display:flex; justify-content:space-between; gap:12px; margin-bottom:7px; color:var(--muted); font-size:.72rem; }
    .piano-scroll { overflow-x:auto; padding:0 0 10px; border-radius:12px; scrollbar-color:#49665c #11181b; }
    .piano { display:flex; width:max-content; min-width:100%; height:174px; padding:10px; border:1px solid #27343a; border-radius:12px; background:#090d0f; box-shadow:inset 0 0 30px #000; }
    .piano-octave { position:relative; display:flex; width:336px; min-width:336px; height:152px; }
    .piano-key { cursor:pointer; touch-action:manipulation; }
    .white-key { position:relative; width:48px; height:152px; padding:0 0 9px; display:flex; align-items:flex-end; justify-content:center; border:1px solid #8b9698; border-radius:0 0 7px 7px; background:#fff; color:#182022; font:700 .68rem ui-monospace,monospace; }
    .white-key:hover,.white-key.active { background:#fff; box-shadow:inset 0 0 0 3px var(--mint); }
    .black-key { position:absolute; z-index:2; top:0; width:28px; height:94px; padding:0 0 8px; display:flex; align-items:flex-end; justify-content:center; border:1px solid #000; border-radius:0 0 5px 5px; background:#050607; color:#d9e1df; font:650 .57rem ui-monospace,monospace; }
    .black-key:hover,.black-key.active { background:#050607; color:#fff; box-shadow:inset 0 0 0 2px var(--mint); }
    .edit-notice { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:10px 0 0; padding:9px 10px; border:1px solid #6c582c; border-radius:9px; background:#312918; color:#ffd98e; font-size:.75rem; }
    .composer-controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .note-picker { display:grid; grid-template-columns:36px 1fr 36px; align-items:center; min-width:0; border:1px solid var(--line); border-radius:11px; background:#0e1317; overflow:hidden; }
    .step-btn { align-self:stretch; min-height:58px; padding:0; border:0; background:#182127; color:var(--mint); cursor:pointer; font-size:1rem; }
    .step-btn:hover { background:#223038; }
    .picker-value { min-width:0; padding:8px 4px; text-align:center; }
    .picker-value span { display:block; margin-bottom:3px; color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; }
    .picker-value strong { display:block; overflow:hidden; text-overflow:ellipsis; font:650 .9rem ui-monospace,monospace; white-space:nowrap; }
    .note-entry-actions { display:grid; grid-template-columns:1fr; gap:8px; margin-top:8px; }
    .note-entry-actions.editing { grid-template-columns:1fr 1fr; }
    .add-note { width:100%; }
    .sequence-label { margin-top:14px; }
    .note-sequence { display:flex; flex-wrap:nowrap; gap:7px; min-height:65px; padding:10px 8px; overflow-x:auto; overflow-y:hidden; border:1px solid var(--line); border-radius:11px; background:#0e1317; scrollbar-color:#49665c #11181b; }
    .note-chip { position:relative; flex:0 0 auto; display:grid; place-items:center; min-width:58px; min-height:48px; padding:6px 27px 6px 9px; border:1px solid #365249; border-radius:9px; background:#172820; }
    .note-chip[role=button] { cursor:pointer; }
    .note-chip[role=button]:focus-visible { outline:2px solid var(--mint); outline-offset:2px; }
    .note-chip.selected { border-color:var(--mint); background:#1d4939; box-shadow:0 0 0 2px rgba(121,237,189,.14); }
    .note-chip.editing { border-color:var(--amber); box-shadow:0 0 0 2px rgba(255,199,96,.16); }
    .note-chip.playing { border-color:var(--cyan); background:#18343d; box-shadow:0 0 0 2px rgba(85,199,232,.2),0 0 16px rgba(85,199,232,.24); }
    .note-chip strong { font:700 .8rem ui-monospace,monospace; }
    .note-chip small { color:var(--muted); font-size:.64rem; }
    .note-flags { position:absolute; left:5px; top:-8px; display:flex; gap:3px; }
    .note-flag { padding:1px 4px; border:1px solid #48655c; border-radius:999px; background:#10231d; color:var(--mint); font:650 .55rem ui-monospace,monospace; }
    .note-action { position:absolute; right:3px; width:20px; height:20px; padding:0; border:0; border-radius:5px; cursor:pointer; opacity:0; transform:scale(.85); transition:.15s; font-size:.7rem; }
    .edit-note { top:3px; background:#263d47; color:#9ee7ff; }
    .delete-note { bottom:3px; background:#492329; color:#ffb1b1; }
    .note-chip:hover .note-action,.note-action:focus-visible { opacity:1; transform:none; }
    .empty-sequence { align-self:center; margin:auto; color:var(--muted); font-size:.75rem; }
    .composer-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
    .composer-actions button { margin:0; }
    button:disabled { cursor:not-allowed; opacity:.42; }
    .playback-actions { display:grid; grid-template-columns:2fr 1fr; gap:8px; margin-top:8px; }
    .playback-actions button { width:100%; }
    .tune-library { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
    .tune-library label { display:block; margin-bottom:7px; color:var(--muted); font-size:.72rem; }
    .tune-name,.saved-tunes { width:100%; min-height:38px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:#0e1317; color:var(--text); }
    .saved-tunes { margin-top:8px; }
    .new-tune { width:100%; margin-top:8px; }
    .library-actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px; }
    .library-actions button { min-width:0; padding:0 7px; }
    .unsaved-warning { margin-top:10px; padding:11px; border:1px solid #735f31; border-radius:10px; background:#302817; }
    .unsaved-warning strong { display:block; color:#ffd98e; font-size:.8rem; }
    .unsaved-warning p { margin:5px 0 10px; color:#cfc4aa; font-size:.72rem; line-height:1.45; }
    .warning-actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
    .warning-actions button { min-width:0; padding:0 6px; }
    .drawer { position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; place-items:center; padding:20px; z-index:5; }
    .drawer.open { display:grid; }
    .settings { width:min(520px,100%); border:1px solid var(--line); border-radius:18px; background:#12191e; box-shadow:0 30px 90px #000; padding:22px; }
    .settings-head { display:flex; justify-content:space-between; align-items:center; }
    .settings h2 { margin:0; font-size:1.2rem; }
    .field { margin-top:16px; }
    .field label { display:block; color:var(--muted); font-size:.78rem; margin-bottom:6px; }
    .field input { width:100%; padding:10px 11px; color:var(--text); border:1px solid var(--line); border-radius:9px; background:#0c1114; }
    .notice { margin:16px 0 0; padding:11px 12px; border-radius:9px; color:#c5d0d3; background:#1d272d; font-size:.76rem; line-height:1.5; }
    .toast { position:fixed; right:22px; bottom:22px; max-width:min(380px,calc(100vw - 44px)); padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#1b242a; box-shadow:var(--shadow); transform:translateY(20px); opacity:0; pointer-events:none; transition:.2s; font-size:.82rem; z-index:9; }
    .toast.show { transform:none; opacity:1; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
    /* Minimal whole-system overview */
    body { background:#f3f3ef; color:#171916; }
    :root { color-scheme:light; --bg:#f3f3ef; --panel:#fff; --panel2:#fafaf7; --line:#dedfd8; --text:#171916; --muted:#747970; --mint:#77e5aa; --cyan:#63bddd; --amber:#efb84d; --danger:#ed6a61; --shadow:0 14px 40px rgba(34,40,32,.07); }
    .shell { max-width:1440px; padding:28px 34px 44px; }
    header { padding-bottom:22px; border-bottom:1px solid var(--line); margin-bottom:0; }
    .mark { border:0; background:#171916; color:#a9f3ca; box-shadow:none; }
    .eyebrow { color:#8a8e86; }
    .mode,.icon-btn { background:#fff; border-color:var(--line); }
    .home-head { display:flex; justify-content:space-between; align-items:end; gap:20px; margin:46px 0 24px; }
    .home-head h2 { max-width:620px; font-size:clamp(2.25rem,5vw,4.65rem); font-weight:520; line-height:.98; letter-spacing:-.065em; }
    .home-head p { max-width:390px; padding-bottom:5px; line-height:1.55; }
    .system-strip { display:flex; align-items:center; gap:14px; margin-bottom:14px; color:var(--muted); font-size:.78rem; }

<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="mark" aria-hidden="true"><svg width="25" viewBox="0 0 32 32" fill="none"><path d="M9 11h14v10H9zM12 7v4m4-4v4m4-4v4M12 21v4m4-4v4m4-4v4M5 14h4m-4 4h4m14-4h4m-4 4h4" stroke="currentColor" stroke-width="2"/></svg></div><div><h1>ESP Control Room</h1><p class="eyebrow">AI Hack Lab · 3 devices</p></div></div>
      <div class="top-actions"><button class="mode" id="mode" type="button" aria-pressed="false"><span class="dot live"></span><span id="mode-label">Demo mode</span></button><button class="icon-btn" id="settings-button" type="button" aria-label="Board settings">⚙</button></div>
    </header>
    <main id="workspace"></main>
  </div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <form class="settings" id="settings-form"><div class="settings-head"><h2 id="settings-title">Board addresses</h2><button class="icon-btn" id="close-settings" type="button" aria-label="Close settings">×</button></div><div id="address-fields"></div><p class="notice">Live control works when this page and the ESP32 boards are on the same Wi‑Fi network. Sensor read-backs also require the ESP32 responses to allow browser access (CORS).</p><div class="button-row"><button class="primary" type="submit">Save addresses</button><button class="secondary" id="reset-addresses" type="button">Reset defaults</button></div></form>
  </div>
  <div class="component-drawer" id="component-drawer" role="dialog" aria-modal="true" aria-labelledby="component-title">
    <section class="component-modal"><div class="component-modal-head"><div><span class="device-number" id="component-board-label"></span><h2 id="component-title"></h2></div><button class="icon-btn" id="close-component" type="button" aria-label="Close component controls">×</button></div><div class="component-modal-body" id="component-body"></div></section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const COLORS = ['red','yellow','green','blue'];
    const PLAYBACK_SYNC_DELAY_MS = 150;
    const NOTE_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
    const PITCHES = Array.from({length:48},(_,i)=>{ const midi=i+48; return {name:`${NOTE_NAMES[midi%12]}${Math.floor(midi/12)-1}`,frequency:Math.round(440*Math.pow(2,(midi-69)/12))}; });
    const NOTE_LENGTHS = [
      {name:'16th note',symbol:'1/16',seconds:0.125},
      {name:'Eighth note',symbol:'1/8',seconds:0.25},
      {name:'Quarter note',symbol:'1/4',seconds:0.5},
      {name:'Half note',symbol:'1/2',seconds:1},
      {name:'Whole note',symbol:'1',seconds:2},
      {name:'32nd note',symbol:'1/32',seconds:0.0625}
    ];
    const LENGTH_ORDER = [5,0,1,2,3,4];
    const defaults = ['http://esp32-1.local','http://esp32-2.local','http://esp32-3.local'];
    const saved = JSON.parse(localStorage.getItem('esp-addresses') || 'null');
    const savedTunes = (()=>{ try { const tunes=JSON.parse(localStorage.getItem('esp-saved-tunes')||'[]'); return Array.isArray(tunes)?tunes:[]; } catch { return []; } })();
    const state = { demo: true, view:'home', selectedBoard:null, section:'overview', component:null, addresses: saved || defaults, timer: null, boards: [
      { online:true,temp:22.6,humidity:44.8,lights:{red:false,yellow:false,green:false,blue:false} },
      { online:true,temp:23.1,humidity:46.2,distance:37.4,angle:90,lights:{red:false,yellow:false,green:false,blue:false} },
      { online:true,temp:22.8,humidity:46.1,lastKey:'7',currentKey:'—',lights:{red:false,yellow:false,green:false,blue:false} }
    ], composer:{pitch:12,activePitch:null,playing:false,paused:false,playToken:0,playbackNoteIndex:null,sequenceScroll:0,scrollToEnd:false,length:2,dotted:false,tie:false,notes:[{pitch:12,length:1},{pitch:14,length:1},{pitch:16,length:2}],selected:[],anchor:null,clipboard:[],history:[],editIndex:null,tuneName:'',savedTunes,currentTuneIndex:null,dirty:true,confirmNew:false} };

    const $ = (selector, root=document) => root.querySelector(selector);
    const $$ = (selector, root=document) => [...root.querySelectorAll(selector)];
    const toast = (message) => { const el=$('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2600); };
    const safeText = (value, fallback='—') => value === null || value === undefined || Number.isNaN(value) ? fallback : value;
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const boardUrl = (index, path) => `${state.addresses[index].replace(/\/$/,'')}${path}`;

    function lightControls(index) {
      return `<div class="label-row"><strong>Lights</strong><span class="quiet">tap to toggle</span></div><div class="lights">${COLORS.map(color=>`<button class="light ${state.boards[index].lights[color]?'on':''}" style="--c:var(--${color==='yellow'?'amber':color==='green'?'mint':color==='blue'?'cyan':'danger'})" type="button" data-light="${color}" data-board="${index}" aria-pressed="${state.boards[index].lights[color]}"><i class="bulb"></i><span>${color}</span></button>`).join('')}</div>`;
    }
    function sensors(index) { const b=state.boards[index]; return `<div class="sensor-pair"><div class="sensor"><span>Temperature</span><strong>${safeText(b.temp)}°</strong></div><div class="sensor"><span>Humidity</span><strong>${safeText(b.humidity)}%</strong></div></div>`; }
    function pianoKeyboard() {
      const whiteSemitones=[0,2,4,5,7,9,11],blackSemitones=[1,3,6,8,10],blackPositions=[36,84,180,228,276];
      return `<div class="piano">${[0,1,2].map(octave=>{const base=octave*12;const whites=whiteSemitones.map(step=>{const index=base+step,pitch=PITCHES[index];return `<button class="piano-key white-key ${state.composer.activePitch===index?'active':''}" type="button" data-piano-pitch="${index}" aria-label="${pitch.name}">${pitch.name}</button>`;}).join('');const blacks=blackSemitones.map((step,i)=>{const index=base+step,pitch=PITCHES[index];return `<button class="piano-key black-key ${state.composer.activePitch===index?'active':''}" style="left:${blackPositions[i]}px" type="button" data-piano-pitch="${index}" aria-label="${pitch.name}">${pitch.name}</button>`;}).join('');return `<div class="piano-octave">${whites}${blacks}</div>`;}).join('')}</div>`;
    }
    function melodyComposer() {
      const notes=state.composer.notes.length ? state.composer.notes.map((note,index)=>{const p=PITCHES[note.pitch],l=NOTE_LENGTHS[note.length]||NOTE_LENGTHS[2],selected=state.composer.selected.includes(index),editing=state.composer.editIndex===index,playing=state.composer.playbackNoteIndex===index;const flags=note.tie?'<span class="note-flag">tie</span>':'';return `<span class="note-chip ${selected?'selected':''} ${editing?'editing':''} ${playing?'playing':''}" role="button" tabindex="0" data-select-note="${index}" aria-selected="${selected}" aria-label="${p.name} ${note.dotted?'dotted ':''}${l.name}${note.tie?', tied':''}${playing?', playing':''}">${flags?`<span class="note-flags">${flags}</span>`:''}<strong>${p.name}</strong><small>${l.symbol}${note.dotted?' ·':''}</small><button class="note-action edit-note" type="button" data-edit-note="${index}" aria-label="Edit ${p.name}">✎</button><button class="note-action delete-note" type="button" data-delete-note="${index}" aria-label="Delete ${p.name}">×</button></span>`;}).join('') : '<span class="empty-sequence">Choose a length, then play a piano key</span>';
      const count=state.composer.selected.length,options=state.composer.savedTunes.map((tune,index)=>`<option value="${index}" ${state.composer.currentTuneIndex===index?'selected':''}>${escapeHtml(tune.name)}</option>`).join(''),editing=state.composer.editIndex!==null;

      $$('[data-delete-note]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const index=Number(btn.dataset.deleteNote);pushUndo();state.composer.notes.splice(index,1);state.composer.selected=state.composer.selected.filter(i=>i!==index).map(i=>i>index?i-1:i);if(state.composer.editIndex===index)state.composer.editIndex=null;else if(state.composer.editIndex>index)state.composer.editIndex--;state.composer.anchor=null;state.composer.dirty=true;renderBoards();});
      $('[data-undo]')?.addEventListener('click',undoNotes);
      $('[data-copy-notes]')?.addEventListener('click',()=>{state.composer.clipboard=[...state.composer.selected].sort((a,b)=>a-b).map(index=>({...state.composer.notes[index]}));toast(`${state.composer.clipboard.length} note${state.composer.clipboard.length===1?'':'s'} copied`);renderBoards();});
      $('[data-paste-notes]')?.addEventListener('click',()=>{pushUndo();const start=state.composer.notes.length;state.composer.notes.push(...state.composer.clipboard.map(note=>({...note})));state.composer.selected=state.composer.clipboard.map((_,i)=>start+i);state.composer.anchor=start;state.composer.scrollToEnd=true;state.composer.dirty=true;toast(`${state.composer.clipboard.length} note${state.composer.clipboard.length===1?'':'s'} pasted at the end`);renderBoards();});
      $('[data-play-notes]')?.addEventListener('click',async()=>{if(!state.composer.notes.length)return toast('Add at least one note first');const start=state.composer.selected.length?Math.min(...state.composer.selected):0,steps=state.composer.notes.slice(start).map((note,offset)=>({index:start+offset,pitch:note.pitch,frequency:PITCHES[note.pitch].frequency,seconds:(NOTE_LENGTHS[note.length]||NOTE_LENGTHS[2]).seconds*(note.dotted?1.5:1),tie:!!note.tie})),events=[];steps.forEach(step=>{const previous=events.at(-1);if(step.tie&&previous?.frequency===step.frequency)previous.seconds+=step.seconds;else events.push({...step});});const melody=events.map(event=>`${event.frequency}:${Number(event.seconds.toFixed(4))}`).join(','),durationMs=events.reduce((total,event)=>total+event.seconds,0)*1000;state.composer.playToken++;state.composer.playing=true;state.composer.paused=false;const launchToken=state.composer.playToken,boardRequest=request(0,`/play_notes?melody=${encodeURIComponent(melody)}`,{read:false,timeout:Math.max(5000,durationMs+5000)});updatePlaybackButtons();setTimeout(()=>{if(state.composer.playToken===launchToken)animatePianoPlayback(steps);},state.demo?0:PLAYBACK_SYNC_DELAY_MS);toast(state.demo?`Playing from note ${start+1}`:`Playing on board 01 from note ${start+1}`);try{await boardRequest;}catch{state.composer.playToken++;state.composer.playing=false;state.composer.paused=false;setSequenceHighlight(null);setPianoHighlight(null);updatePlaybackButtons();toast('Could not send the melody');}});
      $('[data-pause-notes]')?.addEventListener('click',()=>{if(!state.composer.playing)return;state.composer.paused=!state.composer.paused;updatePlaybackButtons();toast(state.composer.paused?'Playback paused':'Playback resumed');});
      $('#tune-name')?.addEventListener('input',e=>{state.composer.tuneName=e.target.value;state.composer.dirty=true;});
      $('[data-save-tune]')?.addEventListener('click',()=>saveCurrentTune(false));
      $('[data-new-tune]')?.addEventListener('click',()=>{if(state.composer.dirty){state.composer.confirmNew=true;renderBoards();}else resetForNewTune();});
      $('[data-save-before-new]')?.addEventListener('click',()=>saveCurrentTune(true));
      $('[data-discard-new]')?.addEventListener('click',()=>resetForNewTune('Changes discarded · new tune ready'));
      $('[data-cancel-new]')?.addEventListener('click',()=>{state.composer.confirmNew=false;renderBoards();});
      $('[data-load-tune]')?.addEventListener('click',()=>{const value=$('#saved-tunes').value;if(value==='')return toast('Choose a saved tune');const index=Number(value),tune=state.composer.savedTunes[index];if(!tune)return toast('Choose a saved tune');state.composer.playToken++;state.composer.playing=false;state.composer.paused=false;state.composer.playbackNoteIndex=null;state.composer.activePitch=null;state.composer.notes=tune.notes.map(note=>({...note}));state.composer.tuneName=tune.name;state.composer.currentTuneIndex=index;state.composer.dirty=false;state.composer.confirmNew=false;state.composer.selected=[];state.composer.anchor=null;state.composer.history=[];state.composer.editIndex=null;toast(`${tune.name} loaded`);renderBoards();});
      $('[data-delete-tune]')?.addEventListener('click',()=>{const value=$('#saved-tunes').value;if(value==='')return toast('Choose a saved tune');const index=Number(value);if(!state.composer.savedTunes[index])return toast('Choose a saved tune');const [removed]=state.composer.savedTunes.splice(index,1);if(state.composer.currentTuneIndex===index){state.composer.currentTuneIndex=null;state.composer.dirty=true;}else if(state.composer.currentTuneIndex>index)state.composer.currentTuneIndex--;localStorage.setItem('esp-saved-tunes',JSON.stringify(state.composer.savedTunes));toast(`${removed.name} deleted`);renderBoards();});
    }
    async function turnAllLightsOff() {
      state.boards.forEach(board=>COLORS.forEach(color=>board.lights[color]=false));renderBoards();
      if(state.demo)return true;
      const results=await Promise.allSettled(state.boards.flatMap((_,index)=>COLORS.map(color=>request(index,`/${color}_light/off`,{read:false}))));
      return results.every(result=>result.status==='fulfilled');
    }
    async function setMode(demo) {
      state.demo=demo; $('#mode-label').textContent=demo?'Demo mode':'Live mode'; $('#mode').setAttribute('aria-pressed',String(!demo)); $('.dot','#mode').classList.toggle('live',demo); clearInterval(state.timer);
      if(demo){state.boards.forEach(b=>b.online=true);await turnAllLightsOff();toast('Demo reset with every light off');}
      else { const reset=await turnAllLightsOff();toast(reset?'All board lights reset to off':'Could not reset every light; check board access');await poll();state.timer=setInterval(poll,5000); }
    }
    $('#mode').onclick=()=>setMode(!state.demo);
    $('#settings-button').onclick=()=>{$('#drawer').classList.add('open');$('#address-fields').innerHTML=state.addresses.map((a,i)=>`<div class="field"><label for="address-${i}">Board 0${i+1}</label><input id="address-${i}" value="${a}" required></div>`).join('');$('#address-0').focus();};
    $('#close-settings').onclick=()=>$('#drawer').classList.remove('open');
    $('#close-component').onclick=closeComponent;
    $('#component-drawer').onclick=e=>{if(e.target===e.currentTarget)closeComponent();};
    $('#drawer').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');};
    $('#settings-form').onsubmit=e=>{e.preventDefault();state.addresses=state.addresses.map((_,i)=>$(`#address-${i}`).value.trim().replace(/\/$/,''));localStorage.setItem('esp-addresses',JSON.stringify(state.addresses));$('#drawer').classList.remove('open');renderBoards();toast('Board addresses saved');if(!state.demo)poll();};
    $('#reset-addresses').onclick=()=>{state.addresses=[...defaults];localStorage.removeItem('esp-addresses');$('#address-fields').innerHTML=state.addresses.map((a,i)=>`<div class="field"><label for="address-${i}">Board 0${i+1}</label><input id="address-${i}" value="${a}" required></div>`).join('');};
    $$('.nav-btn').forEach(btn=>btn.onclick=()=>{ $$('.nav-btn').forEach(b=>b.classList.toggle('active',b===btn)); document.getElementById(btn.dataset.target)?.scrollIntoView({behavior:'smooth',block:'start'}); });
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#drawer').classList.remove('open');closeComponent();}});
    document.addEventListener('click',e=>{if(state.component&&!e.target.closest('.component-modal')&&!e.target.closest('[data-open-component]'))closeComponent();});
    document.addEventListener('click',e=>{if(!e.target.closest('.piano-key')&&!state.composer.playing&&state.composer.activePitch!==null)setPianoHighlight(null);});

    // WebMCP: the visible control-room actions are also available to supporting agents.
    if (document.modelContext?.registerTool) {
      document.modelContext.registerTool({name:'set_esp32_light',title:'Set ESP32 light',description:'Turn one colored light on or off on one ESP32 board.',inputSchema:{type:'object',properties:{board:{type:'integer',minimum:1,maximum:3},color:{type:'string',enum:COLORS},on:{type:'boolean'}},required:['board','color','on'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:async({board,color,on})=>{if(!Number.isInteger(board)||board<1||board>3||!COLORS.includes(color)||typeof on!=='boolean')throw new Error('Invalid board, color, or on value');await setLight(board-1,color,on);return{board,color,on};}});
      document.modelContext.registerTool({name:'read_esp32_dashboard',title:'Read ESP32 dashboard',description:'Read the current board availability, sensors, lights, distance, and keypad values shown in the dashboard.',inputSchema:{type:'object',properties:{refresh:{type:'boolean'}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:async({refresh=false}={})=>{if(refresh)await poll();return{mode:state.demo?'demo':'live',boards:state.boards};}});
    }
    renderBoards();
  </script>
</body>
